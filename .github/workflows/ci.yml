name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (macOS Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Swift Toolchain
        run: swift --version

      - name: Build Host & CLI (Release)
        run: |
          cd msa-host
          swift build -c release

      - name: Run Unit Tests
        run: |
          cd msa-host
          swift test
