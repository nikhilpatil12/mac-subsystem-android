name: Bug Report
description: File a bug report to help improve Mac Subsystem for Android
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: os_version
    attributes:
      label: macOS Version & Hardware
      description: E.g., macOS 14.5 Sonoma on Apple Silicon M3 Pro (18GB)
      placeholder: macOS 14.x / 15.x, M1/M2/M3/M4 or Intel
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `msa-cli start`
        2. Run `msa-cli install my-app.apk`
        3. Launch the app...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Output from `msa-cli status` or `adb logcat -d`.
      render: shell
